name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do motor
        run: ./gradlew :engine:test

      - name: Lint e APK de depuração
        run: ./gradlew :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: |
            engine/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Nomeia o APK com a versão
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "paciencia-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Confere a assinatura: deve ser sempre a mesma chave do projeto.
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "paciencia-$version.apk" | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: paciencia-${{ steps.apk.outputs.version }}
          path: paciencia-*.apk
